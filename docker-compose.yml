# Start the database first (repo sonrisas_cristal_db). In .env:
#   DATABASE_URL="postgresql+psycopg://api_user:<API_DB_PASSWORD, percent-encoded>@postgres:5432/sonrisas_cristal"
services:
  api:
    build: .
    image: sonrisas-cristal-api
    container_name: sonrisas_api
    restart: unless-stopped
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - sonrisas_net

# Created by the docker-compose of sonrisas_cristal_db
networks:
  sonrisas_net:
    external: true
