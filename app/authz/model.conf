# Casbin model: RBAC over the routes of the API.
#   sub = role of the caller (employee, manager, director)
#   obj = route template, exactly as FastAPI declares it (for example /staff/{user_id})
#   act = HTTP method
[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && r.obj == p.obj && r.act == p.act
